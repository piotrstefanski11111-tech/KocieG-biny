<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kocie Głębiny</title>
<style>
:root{--bg:#f3e9dc;--ink:#2b2438;--panel:#fff8ee;--btn:#e8743b;--btnink:#fff;--off:#cdbfae;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1726;--ink:#f3e9dc;--panel:#2b2438;--btn:#f0914f;--btnink:#1b1726;--off:#4a4260;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
h1{margin:0;font-size:1.3rem;letter-spacing:.02em}
#wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;max-width:100%}
canvas{height:100%;max-width:100%;aspect-ratio:2/3;border-radius:14px;touch-action:none;cursor:pointer;image-rendering:auto}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#open,#dexb,#qb,#hb,#gb,#setb{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:8px 18px;font:inherit;cursor:pointer}
#shop,#dex,#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:5;padding:12px}
#shop.on,#dex.on,#ov.on{display:flex}
#dexp{max-width:700px!important}
#dexg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.dc{position:relative;background:var(--bg);border-radius:10px;padding:6px;font-size:.76rem}
.dc canvas{width:100%;height:auto;border-radius:6px;background:linear-gradient(#2a86a8,#0c2a48);display:block}
.dc b{display:block;margin:4px 0 2px}.dc p{margin:0 0 3px;line-height:1.3}
.lk canvas{filter:grayscale(1) brightness(.55)}
.lock{position:absolute;top:10px;right:12px;font-size:1.5rem}
.gl{color:#c89a1a}.rb{color:#a04ab8}
#ovp{max-width:560px!important}
#ovt{font-weight:bold;font-size:1.05rem;margin-bottom:6px}
.bar{height:8px;background:var(--off);border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--btn)}
textarea{width:100%;height:70px;font-size:.7rem;box-sizing:border-box}input[type=range]{width:100%}select{width:100%;padding:6px;font:inherit}
@media(max-width:600px){#bar button{padding:12px 14px;font-size:1rem}}
#panel,#dexp,#ovp{background:var(--panel);color:var(--ink);border-radius:14px;padding:14px;width:100%;max-width:460px;max-height:90%;overflow-y:auto}
#panel h2,#dexp h2,#ovp h2{margin:10px 0 4px;font-size:1rem}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--off)}
.row div{flex:1;font-size:.85rem}.row small{display:block;opacity:.75}
.row button,#close,#dexclose,#ovx{background:var(--btn);color:var(--btnink);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:.8rem;cursor:pointer;min-width:84px}
.row button:disabled{background:var(--off);color:var(--ink);opacity:.7;cursor:not-allowed}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>

Object.assign(BI,{"lavaking": ["Król Lawy", "Fikcyjny. Lawa bazaltowa ma ok. 1100–1200°C, a wulkan Mauna Loa na Hawajach wznosi się ponad 4 km nad poziom morza."], "frostleviathan": ["Mroźny Lewiatan", "Fikcyjny. Lewiatan to biblijny potwór morski opisany m.in. w Księdze Hioba."], "stormlord": ["Władca Burz", "Fikcyjny. Na Ziemi w każdej sekundzie uderza średnio ok. 40–50 piorunów."], "cursedking": ["Przeklęty Król Głębin", "Fikcyjny. Wiele kultur ma legendy o zatopionych królestwach, np. bretońskie miasto Ys czy Atlantyda opisana przez Platona."], "galaxyeater": ["Spiralna Paszcza", "Fikcyjna. W centrum Drogi Mlecznej leży supermasywna czarna dziura Sagittarius A* o masie ok. 4 mln Słońc."], "mozasaur": ["Mozazaur", "Mozazaury to wymarłe wielkie gady morskie z późnej kredy (nie dinozaury). Nazwa pochodzi od rzeki Moza, w której okolicach znaleziono pierwsze skamieniałości."], "mushroomking": ["Król Grzybów", "Fikcyjny. Największy znany organizm to opieńka ciemna z Oregonu; jej grzybnia zajmuje ok. 9 km²."], "ghostcaptain": ["Kapitan Widmo", "Fikcyjny. Legenda o Latającym Holendrze opowiada o statku widmie skazanym na wieczną żeglugę."], "swampmutant": ["Mutant z Bagien", "Fikcyjny. Torfowiska pokrywają ok. 3% lądów, a magazynują więcej węgla niż wszystkie lasy świata."], "crystaldragon": ["Kryształowy Smok", "Fikcyjny. Największe znane kryształy (gips z jaskini Naica w Meksyku) mają ponad 11 m długości."], "timeeater": ["Niszczyciel Czasoprzestrzeni", "Fikcyjny. Według teorii względności Einsteina silna grawitacja spowalnia upływ czasu; przy czarnej dziurze efekt ten jest ogromny."]});DSC.push(...["Nazwa wymyślona. Rekiny żyją od ponad 400 mln lat; przy podwodnym wulkanie Kavachi na Pacyfiku zaobserwowano m.in. rekiny młoty i jedwabiste.","Nazwa wymyślona. Sumy mają wąsy z receptorami smaku i węchu, którymi szukają pokarmu w mętnej wodzie.","Nazwa wymyślona. Prawdziwe pirania żyją w rzekach Ameryki Południowej; mają ostre, trójkątne zęby, ale rzadko atakują ludzi."  odróżnieniu od piratów.","Nazwa wymyślona. Krew węgorzy zawiera toksynę (ichtiotoksynę), niebezpieczną w stanie surowym.","Nazwa wymyślona. Zanieczyszczone wody mogą zakwitać sinicami, które wytwarzają toksyny.","Nazwa wymyślona. Mutacje to zmiany w DNA, które zdarzają się samoistnie lub pod wpływem promieniowania i niektórych substancji.","Nazwa wymyślona. Niektóre ryby, np. sum szklisty, mają przezroczyste ciało, przez które widać kości.","Nazwa wymyślona. Diament to krystaliczny węgiel i najtwardszy naturalny minerał (10 w skali Mohsa).","Nazwa wymyślona. Rubin to odmiana korundu zabarwiona domieszką chromu.","Nazwa wymyślona. Czarna dziura to obszar, z którego nawet światło nie może uciec.","Nazwa wymyślona. Fale grawitacyjne wykryto po raz pierwszy w 2015 r.; pochodziły ze zderzenia dwóch czarnych dziur.","Nazwa wymyślona. Pierwsze zdjęcie cienia czarnej dziury (M87*) opublikowano w 2019 r."]);

  const vg=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,20,0)');vg.addColorStop(1,'rgba(0,0,20,.35)');if(!BM){X.fillStyle=vg;X.fillRect(0,0,W,H)}
  if(storm>0){
    X.fillStyle='rgba(10,15,40,.38)';X.fillRect(0,0,W,H);
    X.strokeStyle='rgba(190,215,255,.55)';X.lineWidth=1.2;X.beginPath();
    for(let i=0;i<90;i++){const rx=(i*53+t*90)%W,ry=(i*97+t*650)%H;X.moveTo(rx,ry);X.lineTo(rx-5,ry+16)}X.stroke();
    if(flash>0){X.fillStyle='rgba(255,255,255,'+flash*.55+')';X.fillRect(0,0,W,H)}
    
  }
  // HUD
  X.fillStyle='rgba(20,16,30,.65)';X.fillRect(10,10,150,46);
  X.fillStyle='#fff';X.font='bold 20px "Trebuchet MS",sans-serif';X.textAlign='left';X.fillText('$ '+fm(S.money),20,34);X.font='11px "Trebuchet MS",sans-serif';X.fillStyle='#9fe8a0';X.fillText(T(27)+' x'+incMult().toFixed(2),20,50);
  X.font='14px "Trebuchet MS",sans-serif';X.textAlign='right';
  X.fillStyle='rgba(20,16,30,.65)';X.fillRect(W-150,10,140,34);X.fillStyle='#fff';
  X.fillText(LOC[S.loc].n+', '+Math.round(depth)+' m',W-18,32);
  X.textAlign='center';
  if(state==='idle'&&!pops.length){X.font='bold 18px "Trebuchet MS",sans-serif';hint(T(30))}
  if(state==='down'){X.font='bold 16px "Trebuchet MS",sans-serif';X.fillStyle='#fff';hint(T(28))}
  if(state==='up'){X.font='bold 16px "Trebuchet MS",sans-serif';X.fillStyle='#fff';hint(T(31)+' '+fish.filter(f=>f.c).length+' / '+cap())}
  if(state==='hover'){X.font='bold 16px "Trebuchet MS",sans-serif';X.fillStyle='#fff';hint(T(29)+' ('+fish.filter(f=>f.c).length+'/'+cap()+')')}
  if(state==='boss')drawBossUI();
  drawSonar();statusHud();
  pops.forEach(p=>{X.globalAlpha=Math.max(0,1-p.t/1.8);X.font='bold 22px "Trebuchet MS",sans-serif';X.fillStyle='#2b2438';X.fillText(p.txt,W/2,170-p.t*30);X.globalAlpha=1});
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop)}
C.addEventListener('pointerdown',()=>hold=true);addEventListener('pointerup',()=>hold=false);addEventListener('pointercancel',()=>hold=false);
applyLang();spawn();ui();if(!S.set.tut)setTimeout(()=>showTut(0),500);requestAnimationFrame(loop);
</script>
</body>
</html>
